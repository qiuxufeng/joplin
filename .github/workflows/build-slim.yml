name: Build Slim Joplin Server

on:
  # 手动触发（推荐：避免每次 push 都构建）
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (如: slim, slim-v3.2.0)'
        required: true
        default: 'slim'
      version:
        description: 'Joplin 版本/分支/标签 (如: dev, v3.2.0)'
        required: true
        default: 'dev'

  # 也支持 push 触发（可选）
  # push:
  #   branches: [dev]
  #   tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write          # ← 重要：允许推送到 GHCR

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || 'dev' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ghcr.io/${{ github.actor }}/joplin-server:${{ github.event.inputs.tag || 'slim' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
