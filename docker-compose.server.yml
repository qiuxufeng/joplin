# =============================================================================
# Joplin Server - 复用已有 PostgreSQL 版
# =============================================================================
networks:
  1panel-network:
    external: true

services:
  app:
    image: ghcr.io/qiuxufeng/joplin-server:slim          # ← 你的精简镜像joplin/server:slim
    container_name: joplin_server
    ports:
      - "22300:22300"
    networks:
      - 1panel-network                 # ← 加入已有 PG 所在的网络
    restart: unless-stopped
    environment:
      - DB_CLIENT=pg
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - APP_PORT=22300
      - APP_BASE_URL=${APP_BASE_URL}
      - TRUST_PROXY=true
      - SERVER_TIME_ZONE=Asia/Shanghai
      - ADMIN_USER_EMAIL=${ADMIN_USER_EMAIL}
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD} 
